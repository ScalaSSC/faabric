syntax = "proto3";

package faabric;

// ---------------------------------------------
// UTIL MESSAGES
// ---------------------------------------------

message EmptyResponse {
    int32 empty = 1;
}

message EmptyRequest {
    int32 empty = 1;
}

// ---------------------------------------------
// FUNCTION SCHEDULING
// ---------------------------------------------

message BatchExecuteRequest {
    // Each BatchExecuteRequest has a unique app id
    int32 appId = 1;

    // The group id may change during a migration
    int32 groupId = 2;

    // All messages in a BER have the same user/function
    string user = 3;
    string function = 4;

    enum BatchExecuteType {
        FUNCTIONS = 0;
        THREADS = 1;
        PROCESSES = 2;
        MIGRATION = 3;
    }

    BatchExecuteType type = 5;

    // Shared snapshot used for threads
    string snapshotKey = 6;

    repeated Message messages = 7;

    // Arbitrary context for this batch
    int32 subType = 8;
    bytes contextData = 9;

    // Flag set by the scheduler when this batch is all executing on a single
    // host
    bool singleHost = 10;

    // Hint set by the user to hint that this execution should all be in a
    // single host
    bool singleHostHint = 11;

}

message MessageBatch{
    string invokeHost = 1;
    repeated Message messages = 2;
}

message BatchExecuteRequestList{
    repeated BatchExecuteRequest BatchRequests = 1;
}

message BatchExecuteRequestStatus {
    // Each BatchExecuteRequest has a unique app id
    int32 appId = 1;

    bool finished = 2;

    repeated Message messageResults = 3;

    // Batches can dynamically change size throughout execution. This parameter
    // is a hint provided by the client letting faabric know how many message
    // results we expect for this BER
    int32 expectedNumMessages = 4;
}

message HostResources {
    int32 slots = 1;
    int32 usedSlots = 2;
}

message FunctionStatusResponse {
    enum FunctionStatus {
        OK = 0;
        ERROR = 1;
    }
    FunctionStatus status = 1;
}

message Message {
    int32 id = 1;
    // The app id indicates which BatchExecuteRequest this message belongs to.
    // Each BER has a unique app id
    int32 appId = 2;
    int32 appIdx = 3;
    string mainHost = 4;

    enum MessageType {
        CALL = 0;
        KILL = 1;
        EMPTY = 2;
        FLUSH = 3;
    }

    MessageType type = 5;
    string user = 6;
    string function = 7;

    bytes inputData = 8 [json_name = "input_data"];
    string outputData = 9 [json_name = "output_data"];

    int32 funcPtr = 10;
    int32 returnValue = 11;

    string snapshotKey = 12;

    int64 startTimestamp = 14 [json_name = "start_ts"];
    string resultKey = 15;
    bool executesLocally = 16;
    string statusKey = 17;

    string executedHost = 18;
    int64 finishTimestamp = 19 [json_name = "finish_ts"];

    bool isPython = 21 [json_name = "python"];

    string pythonUser = 24 [json_name = "py_user"];
    string pythonFunction = 25 [json_name = "py_func"];
    string pythonEntry = 26;

    // Function groups
    int32 groupId = 27;
    int32 groupIdx = 28;
    int32 groupSize = 29;

    // MPI
    bool isMpi = 30 [json_name = "mpi"];
    int32 mpiWorldId = 31;
    int32 mpiRank = 32;
    int32 mpiWorldSize = 33 [json_name = "mpi_world_size"];

    string cmdline = 34;

    // Exec-graph utils
    bool recordExecGraph = 35 [json_name = "record_exec_graph"];
    repeated int32 chainedMsgIds = 36;
    // map<string, int32> intExecGraphDetails = 37;
    // map<string, string> execGraphDetails = 38;

    bool isMigrate = 83;
    int64 dispatchReceiveTime = 84;
    int32 executeBatchSize = 85;
    // Chained Call numbers
    bool isScheduledLocally = 86;
    // State
    // Message Type : 0 stateless/ 1 function state / 2 partitioned state
    int32 messageType = 87;
    // Hint the Parallelism Id of this task
    int64 plannerQueueTime = 88;
    int64 plannerPopTime = 89;
    int64 plannerDispatchTime = 90;
    map<string, int64> metricRecorder = 91;
    int32 workerQueueNum = 92;
    int32 workerQueueWaitTime = 93;
    // Time for claiming executor
    int32 ExecutorPrepareTime = 94;
    int64 workerExecuteStart = 95;
    int64 workerExecuteEnd = 96;
    int32 chainedId = 97;
    int64 hash = 98;
    int32 parallelismId = 99;
    // ModeFlux, partitioned stateful only (messageType 2): the shard the
    // partition key hashes to. A partitioned operator has a single paridx (0)
    // whose keys are cut into shards; the shard, not the paridx, decides which
    // worker holds the key's state.
    int32 shardId = 100;
}

// ---------------------------------------------
// STATE SERVICE
// ---------------------------------------------

message StateRequest {
    string user = 1;
    string key = 2;
    bytes data = 3;
}

message StateChunkRequest {
    string user = 1;
    string key = 2;
    uint64 offset = 3;
    uint64 chunkSize = 4;
}

message StateResponse {
    string user = 1;
    string key = 2;
    bytes data = 3;
}

message StatePart {
    string user = 1;
    string key = 2;
    uint64 offset = 3;
    bytes data = 4;
}

message StateSizeResponse {
    string user = 1;
    string key = 2;
    uint64 stateSize = 3;
}

message StateAppendedRequest {
    string user = 1;
    string key = 2;
    uint32 nValues = 3;
}

message StateAppendedResponse {
    message AppendedValue {
        bytes data = 2;
    }
    string user = 1;
    string key = 2;
    repeated AppendedValue values = 3;
}

// ---------------------------------------------
// POINT-TO-POINT
// ---------------------------------------------

message PointToPointMessage {
    int32 appId = 1;
    int32 groupId = 2;
    int32 sendIdx = 3;
    int32 recvIdx = 4;
    bytes data = 5;
}

message PointToPointMappings {
    int32 appId = 1;
    int32 groupId = 2;

    message PointToPointMapping {
        string host = 1;
        int32 messageId = 2;
        int32 appIdx = 3;
        int32 groupIdx = 4;
    }

    repeated PointToPointMapping mappings = 3;
}

// ---------------------------------------------
// FUNCTION MIGRATIONS
// ---------------------------------------------

message PendingMigration {
    int32 appId = 1;
    int32 groupId = 2;
    int32 groupIdx = 3;
    string srcHost = 4;
    string dstHost = 5;
}

// ---------------------------------------------
// FUNCTION STATE SERVICE
// ---------------------------------------------

message FunctionStateRequest {
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    bytes data = 4;
    bool lock = 5;
}

message FunctionStateSizeResponse {
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    uint64 stateSize = 4;
    uint64 lockWaitingTime = 5;
}

message FunctionStateChunkRequest {
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    uint64 offset = 4;
    uint64 chunkSize = 5;
}

message FunctionStatePart {
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    uint64 offset = 4;
    bytes data = 5;
    uint32 stateSize = 6;
    bool unlock = 7;
    string pStateKey = 8;
}

message FunctionStateRegister{
    string user = 1;
    string func = 2;
    string host = 3;
    bool isParition = 4;
    string pInputKey = 5;
    string pStateKey = 6;
}

message FunctionStateRepartition{
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    string newParitionMap = 4;
}

message FunctionStateAdd{
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    string pStateKey = 4;
    bytes data = 5;
}

message FunctionStateTransferRequest{
    string user = 1;
    string func = 2;
    uint32 parallelismId = 3;
    string host = 4;
    bool isParition = 5;
    string pInputKey = 6;
    string pStateKey = 7;
}

message FunctionStateMetricResponse{
    string host = 1;
    
    message FunctionStateMetric{
        string userFuncPar = 1;
        string user = 2;
        string func = 3;
        uint32 parallelismId = 4;
        uint32 lockBlockTime = 5;
        uint32 lockHoldTime = 6;
    }

    repeated FunctionStateMetric metrics = 2;
}

message MigrateState{
    string userFuncPar = 1;
    bytes serializedState = 2;
}

message StateMigrationRequest{
    string sourceHost = 1;
    int32 migrationVersion = 2;
    repeated MigrateState migrateStates = 3;
    MessageBatch messageBatch = 4;
}

message InstanceStatsPayload{
    string instanceName = 1;
    int32 executedCount = 2;
    map<string, int32> sourceStats = 3;
    int32 chainedCallCount = 4;
    map<string, int32> chainedCallStats = 5;
}

message RuntimeStatsResult{
    string host = 1;
    repeated InstanceStatsPayload instancesStats = 2;
}

message RuntimeStatsUpdateRequest{
    repeated RuntimeStatsResult collectedStats = 1;
}

message CustomRequest {
    string payload = 1;
}

message CpuRecord {
    double cpuExecutePct = 1;
    double cpuSchedulePct = 2;
}

message InstanceReplicas{
    string instanceName = 1;
    int32 replicas = 2;
}

message AverageAndCount {
    int32 average = 1;
    int32 count = 2;
}

message ChainedCallSecondProto {
    // destHost -> count
    map<string, int32> hostCount = 1;
}

message InstanceMetricsResultProto {
    map<int64, AverageAndCount> workerQueueTimeStats = 1;
    map<int64, AverageAndCount> workerQueueNumStats = 2;
    map<int64, AverageAndCount> workerExecTimeStats = 3;
    // timestamp -> throughput count
    map<int64, int32> throughputStats = 4;
    // timestamp -> (destHost -> count)
    map<int64, ChainedCallSecondProto> chainedCallHistory = 5;
    // timestamp -> input arrivals count
    map<int64, int32> inputCountStats = 6;
}

message WorkerStats{
    string ip = 1;
    repeated CpuRecord history = 2;
    double cpuLoad = 3;
    repeated InstanceReplicas instanceReplicas = 4;
    map<string, InstanceMetricsResultProto> workerMetrics = 6;
    map<string, int32> instanceQueueNum = 7;
    double executorsNum = 8;
    // ModeFlux: every shard this worker has handed off, and to whom. See
    // ShardMove.
    repeated ShardMove shardMoves = 9;
}

// ModeFlux: a unit of state left its previous owner for `host`. The unit is
// the whole paridx `userFuncPar` of a stateful operator (shardId -1), or one
// shard of the paridx of a partitioned operator (shardId >= 0). `epoch` is
// the unit's ownership epoch in Redis after the move; it only ever grows, so
// of two records for one unit the higher epoch is the newer.
message ShardMove {
    string userFuncPar = 1;
    string host = 2;
    int64 epoch = 3;
    int32 shardId = 4;
}

// ModeFlux: one unit of state handed over inside a FluxShardMigrationRequest.
message FluxShardState {
    string user = 1;
    string function = 2;
    int32 parallelismId = 3;
    // -1: the whole paridx of a stateful operator; serializedState replaces
    // the receiver's copy. >= 0: one shard of a partitioned operator's paridx;
    // serializedState holds that shard's keys only and is merged into the
    // receiver's copy of the paridx.
    int32 shardId = 8;
    bool isPartitioned = 4;
    // False when the source never materialised the state, or state lives in
    // Redis (access_state_remote): the receiver then starts it empty.
    bool hasState = 5;
    bytes serializedState = 6;
    // Ownership epoch the move will publish in Redis.
    int64 epoch = 7;
}

// ModeFlux: everything one rebalancing round hands from sourceHost to one
// receiving worker -- any number of units of state, plus the requests
// travelling with them: those waiting for the units, and surplus stateless
// requests. Sent before the owners are flipped in Redis, so the receiver
// installs the state without the usual ownership check.
message FluxShardMigrationRequest {
    string sourceHost = 1;
    repeated FluxShardState shards = 2;
    MessageBatch messageBatch = 3;
}

// Request for GetWorkerRuntimeStats. The planner piggybacks the stats it
// fetched from every worker in the previous round, so each worker gets a
// cluster-wide view without an extra RPC.
message WorkerRuntimeStatsRequest {
    // Worker IP -> stats returned by that worker in the previous round
    map<string, WorkerStats> clusterStats = 1;
}